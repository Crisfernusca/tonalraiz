<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .ticket-body {
            width: 400px;
            background: #080808;
            color: #fff;
            font-family: 'Arial', sans-serif;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 2px solid #e91e63;
        }

        /* FONDO DIFUSO */
        .ticket-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/susiflor/2.webp') center/cover;
            filter: blur(8px) brightness(0.3);
            z-index: 1;
        }

        .ticket-content {
            position: relative;
            z-index: 10;
            padding: 30px;
            text-align: center;
        }

        .ticket-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .show-name {
            font-size: 1.5rem;
            color: #e91e63;
            font-weight: bold;
            margin: 0;
        }

        .artist-name {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.8;
        }

        .event-info {
            font-size: 0.85rem;
            margin: 20px 0;
            line-height: 1.5;
        }

        .qr-section {
            background: #fff;
            width: 150px;
            height: 150px;
            margin: 20px auto;
            padding: 10px;
            border-radius: 10px;
        }

        .qr-section img {
            width: 100%;
            height: 100%;
        }

        .folio-section {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(233, 30, 99, 0.2);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }

        .folio-label {
            font-size: 0.6rem;
            display: block;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .folio-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d4af37;
        }

        .footer-rep {
            font-size: 0.6rem;
            margin-top: 30px;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body style="background: #222; display: flex; justify-content: center; padding: 50px;">

    <div class="ticket-body">
        <div class="ticket-bg"></div>
        
        <div class="ticket-content">
            <div class="ticket-header">
                <p class="artist-name">Susi Flor Presenta:</p>
                <h1 class="show-name">"Hablemos de la Vagina"</h1>
            </div>

            <div class="event-info">
                <p><strong>LUGAR:</strong> Praga Café Bistro | Tijuana</p>
                <p><strong>FECHA:</strong> 11 de Julio, 2026</p>
                <p><strong>ACCESO:</strong> 20:00 H</p>
                <p><strong>CLIENTE:</strong> [NOMBRE DEL COMPRADOR]</p>
            </div>

            <div class="qr-section">
                <!-- El folio dinámico se inserta en la URL del QR -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?data=SR-2026-001&size=150x150&color=e91e63" alt="QR Code">
            </div>

            <div class="folio-section">
                <span class="folio-label">Folio Único de Acceso</span>
                <span class="folio-number">SR-2026-001</span>
            </div>

            <div class="footer-rep">
                Representación Exclusiva:<br>
                Raíz Escénica Producciones
            </div>
        </div>
    </div>

</body>
</html>
